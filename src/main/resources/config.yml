# SmarterKeepInventory — trap & indirect kill attribution
# Config version: new defaults in the tracked-block list are merged into existing
# configs automatically (entries are only ever added, never removed).
config-version: 2

traps:
  # Blocks tracked when placed (gravity blocks: crush + suffocation credit).
  # Vanilla only deals impact damage for anvils and pointed dripstone; sand, gravel
  # and concrete powder kill by suffocation after landing, which is also tracked.
  tracked-blocks:
    - POINTED_DRIPSTONE
    - ANVIL
    - CHIPPED_ANVIL
    - DAMAGED_ANVIL
    - SAND
    - RED_SAND
    - GRAVEL
    - WHITE_CONCRETE_POWDER
    - ORANGE_CONCRETE_POWDER
    - MAGENTA_CONCRETE_POWDER
    - LIGHT_BLUE_CONCRETE_POWDER
    - YELLOW_CONCRETE_POWDER
    - LIME_CONCRETE_POWDER
    - PINK_CONCRETE_POWDER
    - GRAY_CONCRETE_POWDER
    - LIGHT_GRAY_CONCRETE_POWDER
    - CYAN_CONCRETE_POWDER
    - PURPLE_CONCRETE_POWDER
    - BLUE_CONCRETE_POWDER
    - BROWN_CONCRETE_POWDER
    - GREEN_CONCRETE_POWDER
    - RED_CONCRETE_POWDER
    - BLACK_CONCRETE_POWDER
  # Track player-placed dispensers and credit their owner for dispensed projectiles.
  track-dispensers: true
  # Persist trap ownership to traps.yml (autosaved; final save on server stop).
  persistence-enabled: true
  autosave-interval-seconds: 300

attribution:
  # Wither effect kills (applier tracked via splash/lingering/arrow with a known source).
  # Poison is not tracked: it can never kill (the victim is always left at 1 HP).
  indirect:
    enabled: true
    # Allow crediting the victim's own traps/effects? (false = self kills are not credited)
    self-attribution: false
  # Fire/burn deaths credited to whoever ignited the victim (fire charges, flame arrows, etc.).
  fire:
    enabled: true
    # How long an ignition stays valid when the victim later dies of fire (seconds).
    ignition-expiry-seconds: 10

# Verbose console logging for placement, falling-block transfer and attribution results.
debug: false

# Anonymous usage statistics via bStats (https://bstats.org/what-is-my-plugin-id).
# Only aggregate server/feature data is sent; no player names or UUIDs.
# Set to false to opt out.
metrics-enabled: true

messages:
  # Sent only for trap/indirect kills (not for direct PvP). %player% = credited player.
  kills:
    dripstone:
      victim: "You were impaled by %player%'s dripstone."
      killer: "You impaled %victim% with dripstone."
    anvil:
      victim: "You were squished by %player%'s anvil."
      killer: "You squished %victim% with an anvil."
    suffocation:
      victim: "You suffocated under %player%'s falling blocks."
      killer: "You suffocated %victim% under your blocks."
    indirect:
      victim: "You were killed by %player%'s %effect%."
      killer: "You killed %victim% with %effect%."
    arrow:
      victim: "You were shot by %player%'s trap."
      killer: "You shot %victim% with your trap."
    fire:
      victim: "You burned to death from %player%'s fire."
      killer: "Your fire burned %victim% alive."
    explosion:
      victim: "You were blown up by %player%'s trap."
      killer: "You blew up %victim% with your trap."
    generic:
      victim: "You were killed by %player%'s trap."
      killer: "Your trap killed %victim%."
