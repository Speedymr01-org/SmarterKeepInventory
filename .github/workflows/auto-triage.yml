name: Auto-Triage Issues
description: AI-powered issue triage - sets Priority and Effort fields

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to triage"
        required: true
        type: string

permissions:
  issues: write
  contents: read
  # actions/cache needs this to save the model weights
  actions: write

# The model is pulled and run locally on the runner (no cloud API, no API key).
# gpt-oss:120b (65GB) cannot run on a stock runner (16GB RAM / ~14GB disk), so this
# uses qwen3:8b (5.2GB) - same triage prompt, JSON-constrained output, CPU inference.
env:
  OLLAMA_MODEL: qwen3:8b
  OLLAMA_HOST: 127.0.0.1:11434
  OLLAMA_CHAT_URL: http://127.0.0.1:11434/api/chat
  # Bump the suffix to invalidate the weights cache when the model changes
  OLLAMA_CACHE_KEY: ollama-qwen3-8b-v1

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install Ollama
        id: ollama_install
        continue-on-error: true
        timeout-minutes: 15
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama server
        id: ollama_serve
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # install.sh starts a systemd service as user "ollama" that stores weights in
          # /usr/share/ollama/.ollama/models and holds the port. Take it down so the
          # runner-owned server below is the only one, and weights land in ~/.ollama/models.
          sudo systemctl stop ollama > /dev/null 2>&1 || true
          sudo systemctl disable ollama > /dev/null 2>&1 || true
          pkill -f "ollama serve" > /dev/null 2>&1 || true
          sleep 1
          export OLLAMA_MODELS="${HOME}/.ollama/models"
          nohup ollama serve > /tmp/ollama-serve.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "http://${OLLAMA_HOST}/api/version" > /dev/null 2>&1; then
              echo "Ollama is up: $(curl -fsS "http://${OLLAMA_HOST}/api/version")"
              echo "Model dir: ${OLLAMA_MODELS}"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Ollama server did not become ready"
          cat /tmp/ollama-serve.log || true
          exit 1

      - name: Restore model weights
        id: model_cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ${{ env.OLLAMA_CACHE_KEY }}

      - name: Pull model
        id: ollama_pull
        continue-on-error: true
        timeout-minutes: 30
        run: |
          if ollama show "${OLLAMA_MODEL}" > /dev/null 2>&1; then
            echo "Model ${OLLAMA_MODEL} restored from cache"
            ollama list
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Pulling ${OLLAMA_MODEL} (attempt ${attempt}/3)"
            if ollama pull "${OLLAMA_MODEL}"; then
              ollama list
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Could not pull ${OLLAMA_MODEL} - triage will fall back to keyword matching"
          exit 1

      - name: Triage Issue
        uses: actions/github-script@v7
        with:
          script: |
            // issue-opened supplies the issue payload; workflow_dispatch only supplies a number
            let issue = context.payload.issue;
            let issueNumber = issue ? issue.number : undefined;
            if (!issue) {
              // workflow_dispatch inputs live in the payload, not in INPUT_* env vars
              const requested = Number(
                (context.payload.inputs && context.payload.inputs.issue_number) ||
                core.getInput('issue_number')
              );
              if (!requested) {
                throw new Error('No issue payload and no issue_number input provided');
              }
              issueNumber = requested;
              const fetched = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              issue = fetched.data;
            }
            
            const labels = issue.labels.map(l => l.name);
            const isVersionUpdate = labels.includes('Version Update');
            
            const title = issue.title;
            const body = issue.body || '';
            
            // Extract user-selected priority/effort from form if present
            const userPriorityMatch = body.match(/### priority\n\n(.+)/i);
            const userEffortMatch = body.match(/### effort\n\n(.+)/i);
            const userPriority = userPriorityMatch ? userPriorityMatch[1].trim() : null;
            const userEffort = userEffortMatch ? userEffortMatch[1].trim() : null;
            
            // Extract reason field for version updates
            const reasonMatch = body.match(/### reason for update\n\n(.+)/i);
            const reason = reasonMatch ? reasonMatch[1].trim() : '';
            
            // Build prompt for AI
            const prompt = `You are a triage bot for Minecraft Paper plugin issues. Analyze this issue and return ONLY a JSON object with these fields: priority (Urgent/High/Medium/Low), effort (High/Medium/Low, only for bugs/features), typeLabel (bug/enhancement/question/null, only if not already labeled), explanation (brief 1-2 sentence explanation of your decisions). Issue title: ${title}. Issue body: ${body}. ${isVersionUpdate ? 'Reason for update: ' + reason + '.' : ''} ${userPriority ? 'User suggested priority: ' + userPriority + '.' : ''} ${userEffort ? 'User suggested effort: ' + userEffort + '.' : ''} Is version update: ${isVersionUpdate}. Rules: Urgent for crashes/data loss/security/completely broken. High for major broken features/community events/integral functionality/no workaround. Medium for standard issues with moderate impact. Low for cosmetic/minor/nice-to-have. User input is a hint but you decide independently. Consider context like community servers/events/production use. Return ONLY valid JSON.`;
            
            // Local, self-hosted model endpoint (no cloud API, no API key)
            const ollamaModel = process.env.OLLAMA_MODEL || 'qwen3:8b';
            const ollamaUrl = process.env.OLLAMA_CHAT_URL || 'http://127.0.0.1:11434/api/chat';
            
            let priority = 'Medium';
            let effort = 'Low';
            let typeLabel = null;
            let usedAI = false;
            
            // Try AI with 2 retries
            for (let attempt = 1; attempt <= 2; attempt++) {
              try {
                console.log('AI attempt ' + attempt + '/2');
                
                const response = await fetch(ollamaUrl, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    model: ollamaModel,
                    messages: [
                      { role: 'user', content: prompt }
                    ],
                    // Constrain the sampler to valid JSON and skip qwen3's reasoning
                    // pass, so triage stays parseable and fast on CPU.
                    format: 'json',
                    think: false,
                    // Streamed so a slow CPU inference cannot hit the HTTP idle timeout.
                    // The accumulated text is identical to a non-streamed response.
                    stream: true
                  })
                });
                
                if (!response.ok) {
                  const errText = await response.text();
                  throw new Error('API returned ' + response.status + ': ' + errText.slice(0, 300));
                }
                
                // Reassemble the newline-delimited JSON stream
                const rawStream = await response.text();
                let content = '';
                let thinking = '';
                for (const line of rawStream.split('\n')) {
                  if (!line.trim()) continue;
                  let chunk;
                  try {
                    chunk = JSON.parse(line);
                  } catch (e) {
                    continue;
                  }
                  if (chunk.error) {
                    throw new Error('Ollama error: ' + chunk.error);
                  }
                  if (chunk.message) {
                    if (chunk.message.content) content += chunk.message.content;
                    if (chunk.message.thinking) thinking += chunk.message.thinking;
                  }
                }
                // gpt-oss puts its reasoning in `thinking`; only fall back if no answer was emitted
                if (!content.trim() && thinking.trim()) {
                  console.log('No content returned, falling back to thinking output');
                  content = thinking;
                }
                console.log('AI raw response: ' + content);
                
                // Extract JSON from response (handle markdown code blocks)
                let jsonStr = content;
                if (content.includes('```')) {
                  const match = content.match(/```(?:json)?\s*([\s\S]*?)```/);
                  if (match) jsonStr = match[1];
                }
                
                const result = JSON.parse(jsonStr.trim());
                
                // Validate and use results
                if (['Urgent', 'High', 'Medium', 'Low'].includes(result.priority)) {
                  priority = result.priority;
                }
                if (['High', 'Medium', 'Low'].includes(result.effort)) {
                  effort = result.effort;
                }
                if (['bug', 'enhancement', 'question', null].includes(result.typeLabel)) {
                  typeLabel = result.typeLabel;
                }
                
                usedAI = true;
                console.log('AI triage result: priority=' + priority + ', effort=' + effort + ', type=' + typeLabel);
                console.log('AI explanation: ' + (result.explanation || 'No explanation provided'));
                
                // Comment explanation on issue
                if (result.explanation) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    body: '**AI Triage:** ' + result.explanation
                  });
                }
                break;
                
              } catch (error) {
                console.log('AI attempt ' + attempt + ' failed: ' + error.message);
                if (attempt < 2) {
                  // Wait 1 second before retry
                  await new Promise(r => setTimeout(r, 1000));
                }
              }
            }
            
            // Fallback to keywords if AI failed
            if (!usedAI) {
              console.log('AI failed, falling back to keyword matching');
              const contentLower = (title + ' ' + body).toLowerCase();
              
              if (isVersionUpdate) {
                const reasonLower = reason.toLowerCase();
                if (reasonLower.includes('crash') || reasonLower.includes('security') || reasonLower.includes('critical') || reasonLower.includes('broken') || reasonLower.includes('urgent')) {
                  priority = 'Urgent';
                } else if (reasonLower.includes('needed') || reasonLower.includes('required') || reasonLower.includes('must') || reasonLower.includes('production') || reasonLower.includes('event') || reasonLower.includes('integral') || reasonLower.includes('dependent') || reasonLower.includes('network') || reasonLower.includes('community')) {
                  priority = 'High';
                } else if (reasonLower.includes('server') || reasonLower.includes('want') || reasonLower.includes('like')) {
                  priority = 'Medium';
                } else {
                  priority = 'Low';
                }
              } else {
                if (contentLower.includes('crash') || contentLower.includes('data loss') || contentLower.includes('security') || contentLower.includes('critical') || contentLower.includes('server crash')) {
                  priority = 'Urgent';
                } else if (contentLower.includes('broken') || contentLower.includes('major') || contentLower.includes('urgent') || contentLower.includes('blocking') || contentLower.includes('no workaround') || contentLower.includes('event') || contentLower.includes('integral') || contentLower.includes('dependent')) {
                  priority = 'High';
                } else if (contentLower.includes('cosmetic') || contentLower.includes('minor') || contentLower.includes('nice to have') || contentLower.includes('low priority')) {
                  priority = 'Low';
                }
                
                if (contentLower.includes('feature') || contentLower.includes('implementation') || contentLower.includes('architecture') || contentLower.includes('new feature')) {
                  effort = 'High';
                } else if (contentLower.includes('fix') || contentLower.includes('update') || contentLower.includes('change') || contentLower.includes('modify')) {
                  effort = 'Medium';
                }
                
                if (!labels.includes('bug') && !labels.includes('enhancement') && !labels.includes('question')) {
                  if (contentLower.includes('bug') || contentLower.includes('error') || contentLower.includes('fail') || contentLower.includes('broken')) {
                    typeLabel = 'bug';
                  } else if (contentLower.includes('feature') || contentLower.includes('enhancement') || contentLower.includes('add')) {
                    typeLabel = 'enhancement';
                  } else if (contentLower.includes('question') || contentLower.includes('how to') || contentLower.includes('help')) {
                    typeLabel = 'question';
                  }
                }
              }
              
              console.log('Keyword fallback: priority=' + priority + ', effort=' + effort + ', type=' + typeLabel);
              core.warning('AI triage unavailable - used keyword fallback. Results may need manual review.');
            }
            
            // Add type label if determined (not for version updates)
            if (typeLabel && !isVersionUpdate) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [typeLabel]
              });
              console.log('Added label: ' + typeLabel);
            }
            
            // Set fields via REST API
            const PRIORITY_FIELD_ID = 46329093;
            const EFFORT_FIELD_ID = 46329096;
            
            try {
              const fieldValues = [
                {
                  field_id: PRIORITY_FIELD_ID,
                  value: priority
                }
              ];
              
              // Only set effort for non-version-update issues
              if (!isVersionUpdate) {
                fieldValues.push({
                  field_id: EFFORT_FIELD_ID,
                  value: effort
                });
              }
              
              await github.request('POST /repos/{owner}/{repo}/issues/{issue_number}/issue-field-values', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                issue_field_values: fieldValues
              });
              
              console.log('Set priority to ' + priority + (!isVersionUpdate ? ' and effort to ' + effort : ''));
            } catch (error) {
              console.log('Could not set issue fields: ' + error.message);
              console.log('Issue fields may not be enabled for this organization');
            }
